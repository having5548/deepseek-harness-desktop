[package]
name = "dshdesktop"
version = "1.0.3"
description = "DeepSeek Harness 桌面客户端（Rust / Tauri 版）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync", "macros"] }
# rustls：不依赖系统 OpenSSL，Linux（Ubuntu/UOS/Debian）打包零额外 so 依赖
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
log = "0.4"

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
