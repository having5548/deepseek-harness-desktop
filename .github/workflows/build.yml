name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: none   # Windows 用 Inno Setup 打包（见后续步骤）
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      # Linux 构建依赖（Ubuntu 22.04 自带 webkit2gtk-4.1）
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Prepare bundled runtime (unix)
        if: matrix.os != 'windows-latest'
        run: bash scripts/prepare-runtime.sh

      - name: Prepare bundled runtime (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-runtime.ps1

      - name: Build (unix bundles)
        if: matrix.os != 'windows-latest'
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Build (windows, no bundle)
        if: matrix.os == 'windows-latest'
        run: cargo tauri build --no-bundle

      - name: Build Inno Setup installer (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          mkdir artifacts -Force
          & $iscc installer/setup.iss

      - name: Upload Windows exe + installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/DshDesktop.exe
            artifacts/DshDesktop-Setup-*.exe

      - name: Upload Linux deb
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload macOS dmg
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  # 打 v* 标签推送时：汇总三平台产物并自动创建 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
